<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MycoNatura – Digitales Pilzlexikon</title>
  <meta name="description" content="MycoNatura – kostenloses, offlinefähiges Pilzlexikon mit Bestimmungshilfe und persönlichem Fundbuch.">
  <meta name="theme-color" content="#1f3d2b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a13" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <!-- iOS / Home-Bildschirm -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MycoNatura">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/style.css">
  <script>
    /* Farbschema vor dem ersten Zeichnen setzen (verhindert Aufblitzen) */
    try {
      var t = JSON.parse(localStorage.getItem('myconatura.theme') || '"system"');
      var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="topbar" role="banner">
    <a class="brand" href="#start" aria-label="MycoNatura Startseite">
      <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-mark"></use></svg>
      <span class="brand-name">Myco<span>Natura</span></span>
    </a>
    <div class="topbar-actions">
      <span id="net-status" class="net-pill" hidden>Offline</span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Farbschema wechseln" title="Farbschema wechseln">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div id="view" class="view" aria-live="polite">
      <div class="loading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p>MycoNatura wird geladen …</p>
      </div>
      <noscript>
        <div class="card notice">Bitte aktiviere JavaScript, um MycoNatura zu nutzen.</div>
      </noscript>
    </div>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#start" data-tab="start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Start</span>
    </a>
    <a href="#lexikon" data-tab="lexikon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H8a3 3 0 0 1-3-3zm0 13a3 3 0 0 0 3 3M9 8h6M9 12h6"/></svg>
      <span>Lexikon</span>
    </a>
    <a href="#bestimmen" data-tab="bestimmen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5M11 8v6M8 11h6"/></svg>
      <span>Bestimmen</span>
    </a>
    <a href="#fundbuch" data-tab="fundbuch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 5h6M9 12h6M9 16h3"/></svg>
      <span>Fundbuch</span>
    </a>
    <a href="#mehr" data-tab="mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>Mehr</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="dialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions" id="dialog-actions"></div>
    </div>
  </div>

  <!-- Eigenes Logo (MycoNatura): stilisierter Pilz in einem Blattkreis -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="lg-cap" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c8833f"/>
        <stop offset="1" stop-color="#8a4f22"/>
      </linearGradient>
      <symbol id="logo-mark" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#1f3d2b"/>
        <path d="M32 6c-9 6-14 14-14 22 0 3 1 5 2 7" fill="none" stroke="#6f9a6b" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M32 6c9 6 14 14 14 22 0 3-1 5-2 7" fill="none" stroke="#6f9a6b" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M12 33c0-10 9-17 20-17s20 7 20 17c0 2-1.5 3-3.5 3H15.5C13.5 36 12 35 12 33Z" fill="url(#lg-cap)"/>
        <circle cx="24" cy="25" r="2.2" fill="#f3e9d2" opacity=".9"/>
        <circle cx="35" cy="21.5" r="1.8" fill="#f3e9d2" opacity=".9"/>
        <circle cx="42" cy="28" r="1.6" fill="#f3e9d2" opacity=".9"/>
        <path d="M26 36h12l-1.5 15c-.2 2-2 3.5-4.5 3.5s-4.3-1.5-4.5-3.5Z" fill="#f3e9d2"/>
        <path d="M18 56c4-2 9-3 14-3s10 1 14 3" fill="none" stroke="#6f9a6b" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
